[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-employee-business-automation"
version = "1.0.0"
description = "Autonomous Digital Worker for Enterprise Workflow Automation"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Anas AL-Aghbari", email = "anas.alaghbari.ai@gmail.com" }
]
license = { text = "Commercial Proprietary" }
keywords = ["ai-agent", "business-automation", "enterprise-ai", "langgraph", "notion-crm", "digital-worker"]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "schedule>=1.2.0",
    "colorama>=0.4.6"
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "I", "N", "UP", "B", "A"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
"tests/*" = ["E402"]
